# Arranque completo con Docker:  docker compose up --build
# Antes, copia .env.docker.example a .env y cambia TODAS las contraseñas.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: loto_numeros
      MYSQL_USER: loto_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      # setup.sql crea el esquema la primera vez que arranca el volumen.
      - ./backend/src/infrastructure/database/setup.sql:/docker-entrypoint-initdb.d/001_setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_USER: loto_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: loto_numeros
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      TRUST_PROXY: 1
      SYNC_AUTO: ${SYNC_AUTO:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Dirección de la API tal como la ve el navegador (se fija al compilar).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
