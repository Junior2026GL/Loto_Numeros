server {
  listen 80;
  root /usr/share/nginx/html;

  # Rutas de React: cualquier ruta que no sea un archivo devuelve index.html.
  location / {
    try_files $uri /index.html;
  }

  # Este servidor solo entrega la aplicación web. El navegador llama a la API directamente,
  # usando la dirección que se fijó al compilar (VITE_API_URL); por eso aquí no se hace proxy
  # a ningún "backend": ese nombre solo existe en algunos entornos y haría fallar el arranque.

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
